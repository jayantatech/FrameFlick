server {
    listen 80;
    
    # Match root domain AND all subdomains
    server_name pantherstation.site ~^(.+)\.pantherstation\.site$;
    
    # Alternative: Match everything (simpler)
    # server_name ~^(.*\.)?pantherstation\.site$;
    
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Different caching based on environment
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Disable caching for index.html in dev/qa
    location = /index.html {
        if ($host ~* "dev|qa") {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}